name: infra_jejak
description: "Infra Jejak - Community road infrastructure safety & monitoring app (SDG 9)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Map (OpenStreetMap based - no API key required, good for a student project)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Location & media
  geolocator: ^12.0.0
  image_picker: ^1.1.2

  # Local storage (static/prepared government data + cache)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Remote backend (dynamic community data)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/jkr_blackspots.json
